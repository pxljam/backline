# Production override.
#
# This file describes one application and nothing else. Ports 80 and 443, TLS,
# the certificates and the firewall belong to the machine — see the `vps-infra`
# repository, which runs a shared edge that routes by hostname.
#
# The contract with that edge is three lines: join the external `edge` network,
# declare a hostname with labels, **publish no ports**. The first project to
# publish 80 would own it for the whole machine, so nothing here does.
#
#   docker compose -f docker-compose.yml -f compose.prod.yml --env-file .env up -d --build
#
# Differences from the local compose, all deliberate:
#
#   · The application's own Caddy keeps the `/api` · `/ical` · `/health` split
#     from `infra/Caddyfile`, but listens on plain `:80` behind the edge. Giving
#     it a hostname would make it attempt ACME, which it cannot answer.
#   · Media is served on its own hostname. Presigned URLs are path-style and
#     their SigV4 signature covers the Host header, so a `/media/*` prefix on
#     the main hostname cannot work — see `api/src/services/storage.rs`.
#   · The bucket is **not** anonymous-readable. Every read path presigns, so
#     public objects would add nothing and remove the expiry.
#   · Secrets have no defaults: `${VAR:?}` fails at parse time, before an image
#     is pulled, rather than booting an instance anyone could forge a session
#     against.

x-prod-env: &prod-env
  SESSION_SECRET: ${SESSION_SECRET:?generate it on the server — openssl rand -hex 32}
  PUBLIC_BASE_URL: https://${BACKLINE_DOMAIN:?the public hostname, without a scheme}
  S3_PUBLIC_ENDPOINT: https://${BACKLINE_MEDIA_DOMAIN:?the media hostname, without a scheme}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?refusing to start on the default password}

  storage:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?refusing to start on the default password}
      # The console has no business facing the internet.
      MINIO_BROWSER: "off"
    expose:
      - "9000"
    # Declaring any network removes the implicit `default`: without it here the
    # API would lose its own storage.
    networks:
      - default
      - edge
    labels:
      caddy: ${BACKLINE_MEDIA_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 9000}}"
      # Never rewrite Host upstream: the presigned signature is computed over it.
      caddy.header.X-Content-Type-Options: nosniff
      caddy.header.Strict-Transport-Security: max-age=31536000

  storage-init:
    # Same as the base file, minus `mc anonymous set download`: in production an
    # object is reachable only through a presigned URL, which expires.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 ${MINIO_ROOT_USER:?} ${MINIO_ROOT_PASSWORD:?} &&
      mc mb --ignore-existing local/${S3_BUCKET:-backline} &&
      echo 'bucket ready'"

  api:
    environment:
      <<: *prod-env
      BIND_ADDR: 0.0.0.0:8080
      RUN_SEED: "0"

  bot:
    environment:
      <<: *prod-env
      RUN_MIGRATIONS: "0"
      RUN_SEED: "0"
      API_INTERNAL_URL: http://api:8080

  proxy:
    environment:
      # A bare port, never the hostname: TLS is terminated by the edge.
      SITE_ADDRESS: ":80"
    expose:
      - "80"
    networks:
      - default
      - edge
    labels:
      caddy: ${BACKLINE_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.header.Strict-Transport-Security: max-age=31536000
      caddy.header.X-Content-Type-Options: nosniff
      caddy.header.X-Frame-Options: DENY
      caddy.header.Referrer-Policy: no-referrer
      # No `encode` here: `infra/Caddyfile` already compresses, and doing it
      # twice only costs CPU on a 4 GB box.

networks:
  edge:
    external: true
