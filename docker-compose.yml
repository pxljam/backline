# Backline — the full stack. `docker compose up` is enough (see compose.local.yml).
name: backline

x-api-env: &api-env
  DATABASE_URL: postgres://${POSTGRES_USER:-backline}:${POSTGRES_PASSWORD:-backline}@db:5432/${POSTGRES_DB:-backline}
  S3_ENDPOINT: http://storage:9000
  S3_BUCKET: ${S3_BUCKET:-backline}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-backline}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-backline-dev-secret}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9100}
  SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me-in-production-please}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  STILLS_URL: http://stills:3000
  RUST_LOG: ${RUST_LOG:-info,backline=debug,sqlx=warn}
  RUN_MIGRATIONS: "1"
  RUN_SEED: ${RUN_SEED:-1}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backline}
      POSTGRES_DB: ${POSTGRES_DB:-backline}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backline} -d ${POSTGRES_DB:-backline}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-backline}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-backline-dev-secret}
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  storage-init:
    image: quay.io/minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 ${MINIO_ROOT_USER:-backline} ${MINIO_ROOT_PASSWORD:-backline-dev-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-backline} &&
      mc anonymous set download local/${S3_BUCKET:-backline} &&
      echo 'bucket pret'"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      <<: *api-env
      BIND_ADDR: 0.0.0.0:8080
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["/usr/local/bin/bot"]
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "0"
      RUN_SEED: "0"
      API_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  stills:
    build:
      context: .
      dockerfile: stills/Dockerfile
    environment:
      PORT: "3000"
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-backline}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-backline}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-backline-dev-secret}
    depends_on:
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped

  proxy:
    image: caddy:2.8-alpine
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8088}
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  db-data:
  storage-data:
  caddy-data:
  caddy-config:
